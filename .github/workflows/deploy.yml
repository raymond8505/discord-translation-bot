name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The repo is public, so `pull_request` runs a fork's code. Nothing here writes to
# the repo, so the token that code runs beside gets read-only: without this block it
# inherits the repository default, which is frequently read/write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # corepack enable before setup-node so the yarn shim resolves to the
      # packageManager-pinned Yarn 4 and setup-node's `cache: yarn` detects it.
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test:run

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate env var deploy sync
        run: bash scripts/validate-deploy-env.sh
      - name: Validate Docker build
        run: docker build .
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config -q
      # .env.example gives every var a value, so the step above only ever
      # exercises the populated path. This one renders the .env the deploy
      # actually writes, where the difference between unset and blank bites.
      - name: Validate compose env under production conditions
        run: bash scripts/validate-compose-env.sh

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Pushes to main and manual redeploys, never pull requests. The branch guard
    # matters for workflow_dispatch, which has no branch filter: the ssh script
    # resets the VPS to origin/main, so a dispatch from any other branch would
    # report a deploy of code that was never deployed.
    # The owner guard is for forks: a fork's own push to main would otherwise queue a
    # deploy that can only fail, against secrets it does not have.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
      && github.repository_owner == 'raymond8505'

    # Two deploys at once would race the same `git reset --hard` and `compose up` in
    # one directory on the VPS. Queue them; never cancel a deploy mid-flight, which
    # could leave the checkout and the running containers at different commits.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false

    steps:
      - name: Deploy to VPS
        # SHA-pinned, not tag-pinned: a tag can be moved to new code, and this action
        # is handed every secret in the deploy. Bump by resolving the tag to its SHA.
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          GH_DEPLOY_KEY: ${{ secrets.GH_DEPLOY_KEY }}
          # Optional, and deliberately absent from the `:?` guards below: an
          # unset secret arrives blank, blankToUndefined() in src/env.ts reads
          # that as undefined, and Redis stays unauthenticated on its own
          # network. Set the secret to turn authentication on.
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DISCORD_TOKEN,DISCORD_CLIENT_ID,GUILD_ID,GH_DEPLOY_KEY,REDIS_PASSWORD
          script: |
            set -e

            # A missing repository secret arrives as an empty string, not as an unset
            # variable, and would otherwise be written into .env as `DISCORD_TOKEN=`.
            # The container then crash-loops on a zod error one job later; fail here
            # instead, naming the secret. `:?` treats empty as unset, which is what we want.
            : "${DISCORD_TOKEN:?missing repository secret DISCORD_TOKEN}"
            : "${DISCORD_CLIENT_ID:?missing repository secret DISCORD_CLIENT_ID}"
            : "${GUILD_ID:?missing repository secret GUILD_ID}"
            : "${GH_DEPLOY_KEY:?missing repository secret GH_DEPLOY_KEY}"

            # Set up deploy key for private repo access. The write happens under
            # umask 077 rather than being chmod'd afterwards: the chmod leaves a
            # window in which any other account on the VPS can read the key.
            # printf '%s\n' is load-bearing — GitHub strips a multiline secret's
            # trailing newline and '%s' alone yields "error in libcrypto".
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            ( umask 077; printf '%s\n' "${GH_DEPLOY_KEY}" > ~/.ssh/github_discord_translation_bot )
            chmod 600 ~/.ssh/github_discord_translation_bot
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null || true
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/github_discord_translation_bot"

            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH }}"
            : "${DEPLOY_PATH:?missing repository secret VPS_DEPLOY_PATH}"
            # Derived, not hardcoded, so a fork deploying to its own VPS clones itself.
            REPO="git@github.com:${{ github.repository }}.git"

            if [ -d "${DEPLOY_PATH}/.git" ]; then
              cd "${DEPLOY_PATH}"
              git remote set-url origin "${REPO}"
              git fetch origin main
              git reset --hard origin/main
            else
              git clone "${REPO}" "${DEPLOY_PATH}"
              cd "${DEPLOY_PATH}"
            fi

            # Runtime env for docker compose. Service URLs, backend and TTL are
            # literals: change them here (and in .env.example) to change prod.
            # Written under umask 077 so the bot token is never briefly world-readable;
            # the chmod covers an .env left behind by an earlier, looser deploy, which
            # the umask alone would not re-mode.
            ( umask 077
            {
              echo "DISCORD_TOKEN=${DISCORD_TOKEN}"
              echo "DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}"
              echo "GUILD_ID=${GUILD_ID}"
              echo "REDIS_URL=redis://redis:6379"
              echo "REDIS_PASSWORD=${REDIS_PASSWORD}"
              echo "LT_URL=http://libretranslate:5000"
              echo "BACKEND=libretranslate"
              echo "CACHE_TTL_SECONDS=2592000"
              # Abuse ceilings, not throttles: a fast-moving thread has one
              # person translating several messages in a row, well under 20/min.
              echo "RATE_LIMIT_USER_PER_MIN=20"
              echo "RATE_LIMIT_GUILD_PER_HOUR=2000"
              # Argos model codes (pb = pt-BR), matching the committed locale
              # files in src/i18n/messages. Omitting this loads all ~100
              # models: ~10 GB of disk and far more RAM than the bot serves
              # languages for.
              echo "LT_LOAD_ONLY=en,es,fr,de,nl,pt,pb"
            } > .env
            )
            chmod 600 .env

            docker compose up -d --build --remove-orphans

            # The bot reports healthy once its gateway session is up (~30-60s).
            # libretranslate is deliberately not waited on: its first start
            # downloads ~10 GB of models and the bot copes until it is ready.
            echo "Waiting for discord-translation-bot..."
            for i in $(seq 1 24); do
              STATUS=$(docker inspect --format '{{.State.Health.Status}}' discord-translation-bot 2>/dev/null || echo "missing")
              if [ "${STATUS}" = "healthy" ]; then
                echo "Health check passed!"
                break
              fi
              if [ "$i" = "24" ]; then
                echo "Health check failed after 120s (status: ${STATUS}) — recent logs:"
                docker logs --tail 50 discord-translation-bot
                exit 1
              fi
              sleep 5
            done

            # Clean up dangling images after build
            docker image prune -f
