# One file for the VPS and for local development. Every difference lives in
# .env (see .env.example); no override files. Nothing publishes a port: the
# bot only needs outbound access to Discord, and redis/libretranslate are
# reachable solely on this project's default network.
services:
  bot:
    build: .
    container_name: discord-translation-bot
    env_file: .env
    environment:
      NODE_ENV: production
    # tini forwards SIGTERM to node so `compose stop` triggers the graceful shutdown.
    init: true
    restart: unless-stopped
    # The bot talks outbound to Discord and the two sibling services and writes
    # nothing but its heartbeat, so it needs no capabilities and no writable root.
    # The tmpfs is not optional: src/health.ts touches /tmp/<name>.healthy every
    # 30s and the HEALTHCHECK reads its mtime, so a read-only root without it
    # reports the container unhealthy for as long as it runs.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The VPS is shared with another project. Caps here are what stop a leak or a
    # runaway loop in one container from taking the whole host down with it.
    mem_limit: 512m
    pids_limit: 256
    depends_on:
      redis:
        condition: service_healthy
      # service_started, not healthy: a first start of libretranslate downloads
      # ~10 GB of models. The bot boots anyway and answers "still starting"
      # until it is up (src/languages.ts), so a deploy never blocks on it.
      libretranslate:
        condition: service_started
    develop:
      # `docker compose watch` rebuilds the image on source changes (local loop).
      watch:
        - action: rebuild
          path: ./src
        - action: rebuild
          path: package.json
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    # Pinned to the minor, not `7-alpine`: patch releases still arrive (so security
    # fixes do), but a major-version jump never happens behind an unattended deploy.
    image: redis:7.4-alpine
    container_name: discord-translation-bot-redis
    # maxmemory is set below mem_limit on purpose. Without it, a cache that fills
    # the limit gets the container OOM-killed by the kernel; with it, redis evicts
    # its least-recently-used translations and keeps serving. Eviction is the
    # correct failure mode for a cache — every key here is reconstructible.
    #
    # Shell form so --requirepass appears only when REDIS_PASSWORD is set: passing
    # `--requirepass ""` is not the same as omitting it. `$$` escapes compose's own
    # interpolation, leaving the expansion to the container's shell at start-up.
    command:
      - sh
      - -c
      - >-
        exec redis-server --appendonly yes --maxmemory 384mb
        --maxmemory-policy allkeys-lru
        $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
    environment:
      # Key-only: compose omits it entirely when .env does not set it, which is
      # what keeps the unauthenticated default working. Never give it a
      # `${REDIS_PASSWORD:-}` default — that renders set-but-empty and
      # scripts/validate-compose-env.sh fails the build on it.
      REDIS_PASSWORD:
    volumes:
      - redis-data:/data
    restart: unless-stopped
    # Start as redis (999:1000, the uid that owns the volume) instead of letting
    # the image's entrypoint start as root and gosu down to it. That entrypoint
    # chowns the data dir first, which needs CAP_CHOWN and CAP_DAC_OVERRIDE — so
    # with cap_drop: ALL it fails "find: ./appendonlydir: Permission denied" and
    # the container never becomes healthy. Starting as the owner needs no
    # capabilities at all, which is the stronger position anyway.
    user: "999:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      # Must authenticate too, or a password-protected server answers PING with
      # NOAUTH and the container never reports healthy. --no-auth-warning keeps
      # the password off stderr.
      # `$$` again: with a single `$` compose would substitute the password at
      # config time and bake it into the container spec, where `docker inspect`
      # prints it. Expanding in the container's shell keeps it out of there.
      test:
        - CMD-SHELL
        - >-
          redis-cli $${REDIS_PASSWORD:+--no-auth-warning -a "$$REDIS_PASSWORD"} ping
          | grep -q PONG
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  libretranslate:
    # Pinned, not `latest`. Every deploy runs `compose up --build`, so `latest`
    # let an unreviewed upstream release pull itself onto the VPS — into the one
    # container that sees the plaintext of every translated message. Bump this
    # deliberately: check the release notes, then change the tag here.
    image: libretranslate/libretranslate:v1.9.6
    container_name: discord-translation-bot-libretranslate
    environment:
      # Key-only on purpose. Compose renders a key with no value as null and
      # omits the variable, which is how LibreTranslate is asked for every
      # language; it still picks the value up from .env when one is set there.
      # An empty string is NOT equivalent: LibreTranslate reads it as "load
      # these zero languages", then dies on `languages[0]` of an empty list.
      # Set LT_LOAD_ONLY in .env locally to limit the model download.
      LT_LOAD_ONLY:
      LT_DISABLE_WEB_UI: "true"
      LT_UPDATE_MODELS: "true"
    volumes:
      - lt-models:/home/libretranslate/.local:rw
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No read_only here: unlike the bot, this image writes throughout its own
    # filesystem (venv caches, Argos staging) and confining it would need a tmpfs
    # per path. Loading the seven models plus the Python/torch runtime is the
    # memory floor, so this cap is high — it is a runaway guard, not a diet.
    mem_limit: 4g
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Covers the first-run model download for the full language set.
      start_period: 30m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
  lt-models:
