# Secret scanning config. `gitleaks detect` runs over the full history in CI and
# from the pre-commit hook over staged changes.
#
# Every entry below is a false positive that has been read and understood. Add
# to this file only after confirming the match is not a secret — never to make a
# failing scan quiet. A real leak is fixed by rotating the credential, not by
# allowlisting it.

[extend]
useDefault = true

[[allowlists]]
description = """
DEPLOY.md, the VPS runbook, documents generating the two SSH keys, and quotes
the PEM header so the reader knows which lines to copy. It is the literal string
"-----BEGIN OPENSSH PRIVATE KEY-----" in prose, never key material.

condition = "AND" is load-bearing: criteria within one allowlist default to OR,
which would allowlist that header in every file in the repo — and a real
OpenSSH private key opens with exactly that line, so the entry meant to excuse
one sentence of prose would excuse the leak it describes. AND keeps the excuse
to this header in these files.

README.md is listed alongside DEPLOY.md because CI scans the full history, and
the runbook lived in README.md until it moved. A path drops off this list only
once no commit reachable from main still carries the header there, which a
history rewrite is the only way to reach — so treat the list as append-only.
"""
condition = "AND"
paths = ['''^README\.md$''', '''^DEPLOY\.md$''']
regexes = ['''-----BEGIN OPENSSH PRIVATE KEY-----''']

[[allowlists]]
description = """
Test fixtures. Discord ids are 17-20 digit snowflakes, so any placeholder of the
right shape trips the client-id rule; these are the deliberately fake
123456789012345678 / 876543210987654321 sort. The whole directory is excluded
from the built image by tsconfig.build.json and never holds real configuration —
the one place real values live is .env, which is gitignored and unscanned.
"""
paths = ['''^src/fixtures/.*\.fixture\.ts$''']
